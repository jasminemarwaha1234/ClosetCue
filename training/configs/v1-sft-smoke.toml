# 5-step smoke of v1-sft.toml: proves the dataset loads and a 3072-token row fits on the L4.
# No [huggingface] table: smoke run 2 (job 633352df677e) already proved the merged push.
kind = "train"

[job]
name = "v1-sft-smoke"

[model]
base = "unsloth/Llama-3.2-3B-Instruct"

[dataset]
id = "e6447f2e5a33"

[method]
type = "sft_text"
learning_rate = 1e-4
max_steps = 5
max_seq_length = 3072
lora_rank = 16
lora_alpha = 32

[resources]
gpu_type = "L4-24GB"
gpu_count = 1

[provider]
name = "aws"
