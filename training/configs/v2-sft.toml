# v2-sft: v1-sft's hyperparameters on the v2 data (training/data/sft_train.jsonl, 261 rows, 25- and
# 50-candidate prompts only): no `total` in the answers, the budget as a reward gate, near-ties
# broken toward cheaper outfits, and the athletic occasion rule. Veri dataset outfit-sft-v2.
# Longest row is 2,579 Llama 3.2 tokens (system + user + assistant), so 3072 truncates nothing.
kind = "train"

[job]
name = "v2-sft"

[model]
base = "unsloth/Llama-3.2-3B-Instruct"

[dataset]
id = "ff38c670ba1d"

[method]
type = "sft_text"
learning_rate = 1e-4
num_epochs = 2
max_seq_length = 3072
lora_rank = 16
lora_alpha = 32

[resources]
gpu_type = "L4-24GB"
gpu_count = 1

[provider]
name = "aws"

[huggingface]
repo = "CharlieBrown364/outfit-llama-v2-sft"
artifact = "merged"
private = false
